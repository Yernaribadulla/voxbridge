[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voxbridge"
version = "0.4.0"
description = "Local-first real-time voice translator for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "PySide6>=6.7",
  "numpy>=1.26",
  "requests>=2.32",
  "SoundCard>=0.4.6; sys_platform == 'win32'",
  "pynput>=1.7.7; sys_platform == 'win32'",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1.0"]
test = ["pytest>=8.0"]
build = ["pyinstaller>=6.0", "build>=1.0"]

[project.scripts]
voxbridge = "app.ui.main:run"

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
"app.ui" = ["*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
