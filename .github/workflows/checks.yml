name: Checks
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt import dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
